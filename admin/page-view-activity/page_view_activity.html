<div id="page-view-activity-app" v-cloak>
    <template v-if="loaded">
        <div class="card shadow-sm mb-4">
            <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                <h4 class="card-title mb-0">Page View Activity</h4>
                <div class="d-flex align-items-center gap-2">
                    <div class="dropdown">
                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-download"></i> Export
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" :href="exportUrl"><i class="bi bi-filetype-csv"></i> CSV</a></li>
                        </ul>
                    </div>
                    <button class="btn btn-sm btn-outline-primary" type="button" @click="showFilters = !showFilters">
                        <i class="bi bi-funnel"></i> Filters
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div v-if="error" class="alert alert-danger alert-dismissible fade show" role="alert">
                    {{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" @click="error = ''"></button>
                </div>

                <div v-if="showFilters" class="border rounded-3 p-3 mb-3 bg-light">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Time Range</label>
                            <select class="form-select form-select-sm" v-model="filters.range">
                                <option value="">All</option>
                                <option value="24h">Last 24 Hours</option>
                                <option value="today">Today</option>
                                <option value="7d">Last 7 Days</option>
                                <option value="30d">Last 30 Days</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Country (ISO code or 'empty')</label>
                            <input type="text" class="form-control form-control-sm" v-model="filters.country" placeholder="e.g. US, DE, empty">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Device Type</label>
                            <select class="form-select form-select-sm" v-model="filters.device">
                                <option value="">All</option>
                                <option value="desktop">Desktop</option>
                                <option value="mobile">Mobile</option>
                                <option value="tablet">Tablet</option>
                                <option value="bot">Bot</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Browser</label>
                            <input type="text" class="form-control form-control-sm" v-model="filters.browser" placeholder="e.g. Chrome">
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-3">
                        <button class="btn btn-sm btn-primary" type="button" @click="applyFilters">Apply Filters</button>
                        <button class="btn btn-sm btn-outline-secondary" type="button" @click="clearFilters">Clear</button>
                    </div>
                </div>

                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                    <button class="btn btn-sm btn-outline-primary" type="button" @click="showFilters = !showFilters">
                        <i class="bi bi-funnel"></i> Filters
                    </button>
                    <div class="d-flex flex-wrap gap-2">
                        <span v-if="filters.range" class="badge rounded-pill text-bg-primary">Range: {{ rangeLabel(filters.range) }}</span>
                        <span v-if="filters.country" class="badge rounded-pill text-bg-info">Country: {{ filters.country === 'empty' ? 'Unknown' : filters.country.toUpperCase() }}</span>
                        <span v-if="filters.device" class="badge rounded-pill text-bg-warning">Device: {{ capitalize(filters.device) }}</span>
                        <span v-if="filters.browser" class="badge rounded-pill text-bg-secondary">Browser: {{ filters.browser }}</span>
                        <span v-if="!filters.range && !filters.country && !filters.device && !filters.browser" class="text-muted small">No active filters</span>
                    </div>
                </div>

                <div v-if="loading" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <div class="mt-2 text-muted small">Loading page views...</div>
                </div>

                <div v-else-if="pageViews.length === 0" class="border rounded-3 p-5 text-center text-muted bg-light">
                    No page views recorded yet. Apply different filters or wait for new traffic.
                </div>

                <div v-else class="list-group list-group-flush border rounded-3 overflow-hidden">
                    <div v-for="(pv, index) in pageViews" :key="pv.id || index" class="list-group-item p-2">
                        <div class="d-flex flex-column flex-lg-row align-items-lg-start justify-content-between gap-3">
                            <div class="d-flex align-items-start gap-2">
                                <span v-if="pv.countryCode" class="fi" :class="'fi-' + pv.countryCode.toLowerCase()" :title="pv.countryName"></span>
                                <span v-else class="fi fi-xx" title="Unknown"></span>
                                <div class="d-flex flex-column gap-1">
                                    <span class="fw-semibold">{{ pv.location }}</span>
                                </div>
                            </div>
                            <div class="d-flex flex-wrap justify-content-lg-end gap-2 align-items-center">
                                <span class="badge bg-light text-dark border">{{ pv.deviceLabel }}</span>
                                <span class="badge bg-light text-dark border">{{ pv.browserLabel }}</span>
                                <span class="badge bg-light text-dark border">{{ pv.osLabel }}</span>
                            </div>
                        </div>
                        <div class="row gx-3 gy-1 align-items-start mt-2 small lh-sm">
                            <div class="col-lg-3 d-flex flex-column gap-1">
                                <div class="d-flex justify-content-between border-bottom py-1">
                                    <span class="text-muted text-uppercase fw-semibold small flex-shrink-0">Date</span>
                                    <span class="text-body">{{ pv.date }}</span>
                                </div>
                                <div class="d-flex justify-content-between border-bottom py-1">
                                    <span class="text-muted text-uppercase fw-semibold small flex-shrink-0">Time</span>
                                    <span class="text-body">{{ pv.time }}</span>
                                </div>
                            </div>
                            <div class="col-lg-3 d-flex flex-column gap-1">
                                <div class="d-flex justify-content-between border-bottom py-1">
                                    <span class="text-muted text-uppercase fw-semibold small flex-shrink-0">IP</span>
                                    <span class="text-body">{{ pv.ipAddress }}</span>
                                </div>
                                <div class="d-flex justify-content-between border-bottom py-1">
                                    <span class="text-muted text-uppercase fw-semibold small flex-shrink-0">Language</span>
                                    <span class="text-body">{{ pv.language }}</span>
                                </div>
                            </div>
                            <div class="col-lg-3 d-flex flex-column gap-1">
                                <div class="d-flex justify-content-between border-bottom py-1">
                                    <span class="text-muted text-uppercase fw-semibold small flex-shrink-0">Referrer</span>
                                    <a v-if="pv.referrer" :href="pv.referrer" class="text-success text-decoration-none text-break text-end" target="_blank">{{ pv.referrer }}</a>
                                    <span v-else class="text-muted fst-italic">(No referring link)</span>
                                </div>
                            </div>
                            <div class="col-lg-3 d-flex flex-column gap-1">
                                <div class="d-flex justify-content-between border-bottom py-1">
                                    <span class="text-muted text-uppercase fw-semibold small flex-shrink-0">Page</span>
                                    <a :href="pv.path || '/'" class="text-primary text-decoration-none text-break text-end" target="_blank">{{ pv.path || '/' }}</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3 mt-4">
                    <span class="text-muted small">{{ paginationSummary }}</span>
                    <div class="d-flex align-items-center gap-2">
                        <a class="btn btn-sm btn-outline-secondary" :class="{ disabled: page <= 1 }" href="#" @click.prevent="changePage(1)">All</a>
                        <a class="btn btn-sm btn-outline-secondary" :class="{ disabled: page <= 1 }" href="#" @click.prevent="changePage(page - 1)">«</a>
                        <a v-for="p in pageNumbers" :key="p" class="btn btn-sm" :class="p === page ? 'btn-primary' : 'btn-outline-secondary'" href="#" @click.prevent="changePage(p)">{{ p }}</a>
                        <a class="btn btn-sm btn-outline-secondary" :class="{ disabled: page >= totalPages }" href="#" @click.prevent="changePage(page + 1)">»</a>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="small text-muted">Rows per page:</span>
                        <a v-for="size in [10, 25, 50, 100]" :key="size" class="btn btn-sm" :class="size === pageSize ? 'btn-primary' : 'btn-outline-secondary'" href="#" @click.prevent="changePageSize(size)">{{ size }}</a>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>
