<div id="visitor-activity-app" v-cloak>
    <template v-if="loaded">
        <div class="card shadow-sm mb-4">
            <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                <h4 class="card-title mb-0">Visitor Activity</h4>
                <div class="d-flex align-items-center gap-2">
                    <div class="dropdown">
                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-download"></i> Export
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" :href="exportUrl"><i class="bi bi-filetype-csv"></i> CSV</a></li>
                        </ul>
                    </div>
                    <button class="btn btn-sm btn-outline-primary" type="button" @click="showFilters = !showFilters">
                        <i class="bi bi-funnel"></i> Filters
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div v-if="error" class="alert alert-danger alert-dismissible fade show" role="alert">
                    {{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" @click="error = ''"></button>
                </div>

                <div v-if="showFilters" class="border rounded-3 p-3 mb-3 bg-light">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Time Range</label>
                            <select class="form-select form-select-sm" v-model="filters.range">
                                <option value="">All</option>
                                <option value="24h">Last 24 Hours</option>
                                <option value="today">Today</option>
                                <option value="7d">Last 7 Days</option>
                                <option value="30d">Last 30 Days</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Country (ISO code or 'empty')</label>
                            <input type="text" class="form-control form-control-sm" v-model="filters.country" placeholder="e.g. US, DE, empty">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Device Type</label>
                            <select class="form-select form-select-sm" v-model="filters.device">
                                <option value="">All</option>
                                <option value="desktop">Desktop</option>
                                <option value="mobile">Mobile</option>
                                <option value="tablet">Tablet</option>
                                <option value="bot">Bot</option>
                            </select>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-3">
                        <button class="btn btn-sm btn-primary" type="button" @click="applyFilters">Apply Filters</button>
                        <button class="btn btn-sm btn-outline-secondary" type="button" @click="clearFilters">Clear</button>
                    </div>
                </div>

                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                    <button class="btn btn-sm btn-outline-primary" type="button" @click="showFilters = !showFilters">
                        <i class="bi bi-funnel"></i> Filters
                    </button>
                    <div class="d-flex flex-wrap gap-2">
                        <span v-if="filters.range" class="badge rounded-pill text-bg-primary">Range: {{ rangeLabel(filters.range) }}</span>
                        <span v-if="filters.country" class="badge rounded-pill text-bg-info">Country: {{ filters.country === 'empty' ? 'Unknown' : filters.country.toUpperCase() }}</span>
                        <span v-if="filters.device" class="badge rounded-pill text-bg-secondary">Device: {{ capitalize(filters.device) }}</span>
                        <span v-if="!filters.range && !filters.country && !filters.device" class="text-muted small">No active filters</span>
                    </div>
                </div>

                <div v-if="loading" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <div class="mt-2 text-muted small">Loading visitors...</div>
                </div>

                <div v-else-if="visitors.length === 0" class="border rounded-3 p-5 text-center text-muted bg-light">
                    No visitors recorded yet. Apply different filters or wait for new traffic.
                </div>

                <div v-else class="list-group list-group-flush border rounded-3 overflow-hidden">
                    <div v-for="(visitor, index) in visitors" :key="visitor.id || index" class="list-group-item p-2">
                        <div class="d-flex flex-column flex-lg-row align-items-lg-start justify-content-between gap-3">
                            <div class="d-flex align-items-start gap-2">
                                <span v-if="visitor.countryCode" class="fi" :class="'fi-' + visitor.countryCode.toLowerCase()" :title="visitor.countryName"></span>
                                <span v-else class="fi fi-xx" title="Unknown"></span>
                                <div class="d-flex flex-column gap-1">
                                    <span class="fw-semibold">{{ visitor.location }}</span>
                                    <span class="small text-muted">{{ visitor.ipAddress }}</span>
                                </div>
                            </div>
                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <span class="badge text-bg-secondary">Session {{ visitor.sessionLabel }}</span>
                                <span class="d-flex align-items-center gap-2">
                                    <i :class="visitor.deviceIcon"></i>
                                    <i :class="visitor.osIcon"></i>
                                    <span class="small">{{ visitor.systemSummary }}</span>
                                </span>
                                <button class="btn btn-sm btn-outline-primary" type="button" @click="showDetail(visitor)">
                                    <i class="bi bi-info-circle"></i> Details
                                </button>
                            </div>
                        </div>
                        <div class="row gx-3 gy-1 align-items-start mt-2 small lh-sm">
                            <div class="col-lg-5 d-flex flex-column gap-1">
                                <div class="d-flex justify-content-between border-bottom py-1">
                                    <span class="text-muted text-uppercase fw-semibold small flex-shrink-0">Visit</span>
                                    <span class="text-body">{{ visitor.visitTime }}</span>
                                </div>
                                <div class="d-flex justify-content-between border-bottom py-1">
                                    <span class="text-muted text-uppercase fw-semibold small flex-shrink-0">Duration</span>
                                    <span class="text-body">{{ visitor.duration }}</span>
                                </div>
                            </div>
                            <div class="col-lg-4 d-flex flex-column gap-1">
                                <div class="d-flex justify-content-between border-bottom py-1">
                                    <span class="text-muted text-uppercase fw-semibold small flex-shrink-0">Referrer</span>
                                    <a v-if="visitor.referrer" :href="visitor.referrer" class="text-success text-decoration-none text-break text-end" target="_blank">{{ visitor.referrer }}</a>
                                    <span v-else class="text-muted fst-italic">(No referring link)</span>
                                </div>
                            </div>
                            <div class="col-lg-3 d-flex flex-column gap-1">
                                <div class="d-flex justify-content-between border-bottom py-1">
                                    <span class="text-muted text-uppercase fw-semibold small flex-shrink-0">Path</span>
                                    <a :href="visitor.path || '/'" class="text-primary text-decoration-none text-break text-end" target="_blank">{{ visitor.path || '/' }}</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3 mt-4">
                    <span class="text-muted small">{{ paginationSummary }}</span>
                    <div class="d-flex align-items-center gap-2">
                        <a class="btn btn-sm btn-outline-secondary" :class="{ disabled: page <= 1 }" href="#" @click.prevent="changePage(1)">All</a>
                        <a class="btn btn-sm btn-outline-secondary" :class="{ disabled: page <= 1 }" href="#" @click.prevent="changePage(page - 1)">«</a>
                        <a v-for="p in pageNumbers" :key="p" class="btn btn-sm" :class="p === page ? 'btn-primary' : 'btn-outline-secondary'" href="#" @click.prevent="changePage(p)">{{ p }}</a>
                        <a class="btn btn-sm btn-outline-secondary" :class="{ disabled: page >= totalPages }" href="#" @click.prevent="changePage(page + 1)">»</a>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="small text-muted">Rows per page:</span>
                        <a v-for="size in [10, 25, 50, 100]" :key="size" class="btn btn-sm" :class="size === pageSize ? 'btn-primary' : 'btn-outline-secondary'" href="#" @click.prevent="changePageSize(size)">{{ size }}</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" tabindex="-1" id="visitorDetailModal" ref="detailModal">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Visitor Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" v-if="selectedVisitor">
                        <div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted fw-semibold">Visitor ID</span><span class="text-body text-break text-end">{{ selectedVisitor.id }}</span></div>
                        <div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted fw-semibold">Visit Time</span><span class="text-body text-break text-end">{{ selectedVisitor.createdAt }}</span></div>
                        <div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted fw-semibold">Path</span><span class="text-body text-break text-end">{{ selectedVisitor.path }}</span></div>
                        <div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted fw-semibold">Country</span><span class="text-body text-break text-end">{{ selectedVisitor.country }}</span></div>
                        <div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted fw-semibold">IP Address</span><span class="text-body text-break text-end">{{ selectedVisitor.ipAddress }}</span></div>
                        <div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted fw-semibold">Referrer</span><span class="text-body text-break text-end">{{ selectedVisitor.referrer }}</span></div>
                        <div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted fw-semibold">Device</span><span class="text-body text-break text-end">{{ selectedVisitor.device }}</span></div>
                        <div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted fw-semibold">Browser</span><span class="text-body text-break text-end">{{ (selectedVisitor.browser + ' ' + selectedVisitor.browserVer).trim() }}</span></div>
                        <div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted fw-semibold">OS</span><span class="text-body text-break text-end">{{ (selectedVisitor.os + ' ' + selectedVisitor.osVer).trim() }}</span></div>
                        <div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted fw-semibold">Fingerprint</span><span class="text-body text-break text-end">{{ selectedVisitor.fingerprint }}</span></div>
                        <div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted fw-semibold">User Agent</span><span class="text-body text-break text-end">{{ selectedVisitor.userAgent }}</span></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>
